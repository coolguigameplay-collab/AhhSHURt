name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.4
  PROJECT_NAME: BFEXEOPT
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Update APT
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update --fix-missing

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Patch Flixel Android x64 manifest bug
        if: inputs.name == 'Android x64'
        run: |
          HAXELIB_REPO=$(haxelib config)
          FLIXEL_INCLUDE="$HAXELIB_REPO/flixel/5,6,1/include.xml"

          echo "Patching $FLIXEL_INCLUDE"

          test -f "$FLIXEL_INCLUDE" || {
            echo "include.xml not found in $FLIXEL_INCLUDE"
            exit 1
          }

          perl -pi -e 's/ if="\$\{lime &ge; 8\.2\.0\}"//' "$FLIXEL_INCLUDE"

          grep -n "appCategory" "$FLIXEL_INCLUDE"

      - name: Patch Flixel Android x32 manifest bug
        if: inputs.name == 'Android x32'
        run: |
          HAXELIB_REPO=$(haxelib config)
          FLIXEL_INCLUDE="$HAXELIB_REPO/flixel/5,6,1/include.xml"

          echo "Patching $FLIXEL_INCLUDE"

          test -f "$FLIXEL_INCLUDE" || {
            echo "include.xml not found in $FLIXEL_INCLUDE"
            exit 1
          }

          perl -pi -e 's/ if="\$\{lime &ge; 8\.2\.0\}"//' "$FLIXEL_INCLUDE"

          grep -n "appCategory" "$FLIXEL_INCLUDE"

      - name: Setup Android
        if: inputs.name == 'Android x64' || inputs.name == 'Android x32'
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "Android NDK: $ANDROID_NDK_LATEST_HOME"
          echo "Java 17: $JAVA_HOME_17_arm64"

          test -d "$ANDROID_HOME" || {
            echo "ANDROID_HOME does not exist"
            exit 1
          }

          test -d "$ANDROID_NDK_LATEST_HOME" || {
            echo "ANDROID_NDK_LATEST_HOME does not exist"
            exit 1
          }

          test -d "$JAVA_HOME_17_arm64" || {
            echo "JAVA_HOME_17_arm64 does not exist"
            exit 1
          }

          haxelib run lime setup android

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_arm64"

      - name: Compile
        run: |
          haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
